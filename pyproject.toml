[project]
name = "ngenuity-linux-cli"
dynamic = ["version"]
description = "Configure HyperX peripherals supported by NGENUITY on Linux"
readme = "README.md"
authors = [
    { name = "PMarinov1994", email = "plamen_944@outlook.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["hyperx", "ngenuity", "pulsefire", "mouse", "hid", "linux", "rgb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
]

[project.urls]
Homepage = "https://github.com/PMarinov1994/ngenuity-linux-cli"
Repository = "https://github.com/PMarinov1994/ngenuity-linux-cli"
Issues = "https://github.com/PMarinov1994/ngenuity-linux-cli/issues"
Documentation = "https://github.com/PMarinov1994/ngenuity-linux-cli/tree/master/docs"

[project.scripts]
ngenuity = "ngenuity_linux_cli.cli:main"

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

[tool.hatch.version.raw-options.scm.git]
describe_command = [
    "git", "describe", "--dirty", "--tags", "--long",
    "--match", "v[0-9]*.[0-9]*.[0-9]*", "--exclude", "v*-*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ngenuity_linux_cli"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "CPY",
    "COM812",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
