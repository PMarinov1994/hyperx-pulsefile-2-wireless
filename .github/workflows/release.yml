name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Check that the tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the version ${version} in pyproject.toml"
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Type check
        run: uv run mypy

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ngenuity-linux-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v6

      - name: Publish
        run: uv publish --trusted-publishing always
