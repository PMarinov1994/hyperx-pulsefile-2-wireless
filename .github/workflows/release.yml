name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Type check
        run: uv run mypy

      - name: Build
        run: uv build

      - name: Check that the version comes from the tag
        run: |
          wheel="$(basename dist/*.whl)"
          version="$(echo "${wheel}" | cut -d- -f2)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Built version ${version} does not match the tag ${GITHUB_REF_NAME}"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ngenuity-linux-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v6

      - name: Publish
        run: uv publish --trusted-publishing always
